
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exam Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm text-center mx-auto" style="max-width: 650px;">
        <div class="card-body p-5">
            <h1 class="text-success">Congratulations!</h1>
            <p class="lead">You have successfully completed the exam.</p>

            <h2 class="my-4">{{ submission.exam.title }}</h2>

            <p class="fs-4">
                Score:
                <strong>{{ submission.score }} / {{ total_questions }}</strong>
            </p>

            <p>Submitted by: {{ submission.user.username }}</p>
            <p>Submission time: {{ submission.submitted_at }}</p>

            <a href="/" class="btn btn-primary mt-3">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
